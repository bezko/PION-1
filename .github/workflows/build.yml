name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: firmware (rp2040)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the Pico SDK
        run: |
          git clone --depth 1 --branch 2.3.1 \
            https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          cd $HOME/pico-sdk && git submodule update --init --recursive

      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi \
                                   python3 build-essential libusb-1.0-0-dev

      - name: Install picotool
        run: |
          # The SDK's packaging step needs picotool to build the UF2.
          # Only a source release is published, so build it.
          PICOTOOL_VERSION=2.3.1
          git clone --depth 1 --branch "${PICOTOOL_VERSION}" \
            https://github.com/raspberrypi/picotool.git $HOME/picotool
          cmake -B $HOME/picotool/build -S $HOME/picotool -DCMAKE_BUILD_TYPE=Release
          cmake --build $HOME/picotool/build -j
          sudo cmake --install $HOME/picotool/build

      - name: Build the firmware
        run: |
          cmake -B build -S . \
            -DPICO_SDK_PATH=$HOME/pico-sdk \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Upload the firmware
        uses: actions/upload-artifact@v4
        with:
          name: PION1-firmware
          path: |
            build/PION1.uf2
            build/PION1.elf

  tests:
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc build-essential python3 python3-numpy

      - name: Build and run the DSP test suite
        run: |
          cmake -B tests/build -S tests -DCMAKE_BUILD_TYPE=Release
          cmake --build tests/build -j
          ctest --test-dir tests/build --output-on-failure

      - name: Verify the generated sine table
        run: |
          python3 tools/gen_sine_table.py --check

  docs:
    name: github pages
    runs-on: ubuntu-latest
    needs: [firmware, tests]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the site
        run: |
          mkdir -p _site
          cp docs/site/index.html _site/index.html
          cp -r docs/site/assets _site/

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
