    <rect x="22" y="14" width="8" height="8" rx="1.5"/>
    <rect x="34" y="14" width="8" height="8" rx="1.5"/>
    <rect x="46" y="14" width="8" height="8" rx="1.5"/>
  </g>
  <g fill="none" stroke="#30363d" stroke-width="1.5">
    <rect x="10" y="28" width="8" height="8" rx="1.5"/>
    <rect x="22" y="28" width="8" height="8" rx="1.5"/>
    <rect x="34" y="28" width="8" height="8" rx="1.5"/>
    <rect x="46" y="28" width="8" height="8" rx="1.5"/>
  </g>
  <g fill="#58a6ff">
    <rect x="10" y="42" width="8" height="8" rx="1.5"/>
    <rect x="22" y="42" width="8" height="8" rx="1.5"/>
    <rect x="34" y="42" width="8" height="8" rx="1.5"/>
  </g>
  <g fill="none" stroke="#30363d" stroke-width="1.5">
    <rect x="46" y="42" width="8" height="8" rx="1.5"/>
  </g>
</svg>
